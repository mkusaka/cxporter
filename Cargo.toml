[package]
name = "cxporter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Direct CLI access to Codex-authenticated MCP servers."

[dependencies]
allocative = "=0.3.4"
anyhow = "1"
async-channel = "2.3.1"
clap = { version = "4", features = ["derive"] }
codex-core = { git = "https://github.com/openai/codex", rev = "75b7e06621ac38c2b26a73832e797d49a7307f2b", package = "codex-core" }
codex-core-plugins = { git = "https://github.com/openai/codex", rev = "75b7e06621ac38c2b26a73832e797d49a7307f2b", package = "codex-core-plugins" }
codex-exec-server = { git = "https://github.com/openai/codex", rev = "75b7e06621ac38c2b26a73832e797d49a7307f2b", package = "codex-exec-server" }
codex-login = { git = "https://github.com/openai/codex", rev = "75b7e06621ac38c2b26a73832e797d49a7307f2b", package = "codex-login" }
codex-mcp = { git = "https://github.com/openai/codex", rev = "75b7e06621ac38c2b26a73832e797d49a7307f2b", package = "codex-mcp" }
codex-protocol = { git = "https://github.com/openai/codex", rev = "75b7e06621ac38c2b26a73832e797d49a7307f2b", package = "codex-protocol" }
codex-utils-cli = { git = "https://github.com/openai/codex", rev = "75b7e06621ac38c2b26a73832e797d49a7307f2b", package = "codex-utils-cli" }
rmcp = { version = "0.15.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.18"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
