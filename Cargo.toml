[package]
name = "cxporter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Direct CLI access to Codex-authenticated MCP servers."

[dependencies]
anyhow = "1"
async-channel = "2.3.1"
clap = { version = "4", features = ["derive"] }
# These point at a thin fork of openai/codex@53b5019 whose only change is
# bumping the workspace version away from "0.0.0". codex-core's
# resolve_mcp_oauth_credentials_store_mode() coerces keyring/auto OAuth store
# modes to "file" whenever CARGO_PKG_VERSION == "0.0.0" (its local-dev guard),
# which made `auth inspect/export` unable to read keychain-stored MCP tokens.
# When advancing the pin: update the fork from the new upstream rev, re-apply
# the one-line version bump on top, push, and update the rev here. Branch:
# mkusaka/codex@main.
codex-core = { git = "https://github.com/mkusaka/codex", rev = "ebd948fce23387349b764d16ea0b54e97e677a62", package = "codex-core" }
codex-core-plugins = { git = "https://github.com/mkusaka/codex", rev = "ebd948fce23387349b764d16ea0b54e97e677a62", package = "codex-core-plugins" }
codex-config = { git = "https://github.com/mkusaka/codex", rev = "ebd948fce23387349b764d16ea0b54e97e677a62", package = "codex-config" }
codex-exec-server = { git = "https://github.com/mkusaka/codex", rev = "ebd948fce23387349b764d16ea0b54e97e677a62", package = "codex-exec-server" }
codex-keyring-store = { git = "https://github.com/mkusaka/codex", rev = "ebd948fce23387349b764d16ea0b54e97e677a62", package = "codex-keyring-store" }
codex-login = { git = "https://github.com/mkusaka/codex", rev = "ebd948fce23387349b764d16ea0b54e97e677a62", package = "codex-login" }
codex-mcp = { git = "https://github.com/mkusaka/codex", rev = "ebd948fce23387349b764d16ea0b54e97e677a62", package = "codex-mcp" }
codex-protocol = { git = "https://github.com/mkusaka/codex", rev = "ebd948fce23387349b764d16ea0b54e97e677a62", package = "codex-protocol" }
codex-utils-cli = { git = "https://github.com/mkusaka/codex", rev = "ebd948fce23387349b764d16ea0b54e97e677a62", package = "codex-utils-cli" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rmcp = { version = "1.7.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.18"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
